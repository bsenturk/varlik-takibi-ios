# Supabase CLI project config.
# `project_id` is a LOCAL identifier (not the remote project ref). It just tells
# the CLI that this directory is a Supabase project so `supabase functions deploy`
# can find supabase/functions/<name>/index.ts.
project_id = "varlik-takibi"

# pg_cron bu fonksiyonları Authorization header'ı olmadan çağırıyor; JWT
# doğrulaması açık kalırsa her tick 401 döner (fetch-gold-fx 13.08'de böyle bozuldu).
[functions.fetch-gold-fx]
verify_jwt = false

[functions.fetch-crypto]
verify_jwt = false

[functions.fetch-yahoo]
verify_jwt = false

[functions.scrape-tefas]
verify_jwt = false

[functions.tefas-sync]
verify_jwt = false

[functions.tefas-search]
verify_jwt = false

[functions.send-push-notification]
verify_jwt = false

[functions.market-alert]
verify_jwt = false
